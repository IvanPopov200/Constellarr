name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: constellarr_test
          POSTGRES_USER: constellarr_test
          POSTGRES_PASSWORD: integration-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U constellarr_test -d constellarr_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm --prefix frontend ci
      - run: sudo apt-get update && sudo apt-get install -y par2
      - run: make check
        env:
          TEST_DATABASE_URL: postgresql://constellarr_test:integration-test@127.0.0.1:5432/constellarr_test?sslmode=disable
      - run: make build
      - run: docker build -t constellarr:check .
